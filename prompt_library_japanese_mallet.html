<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Prompt Library</title><style>*{box-sizing:border-box}body{margin:0;padding:24px 14px 40px;background:#f4f1eb;color:#29251f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;line-height:1.8}.container{max-width:900px;margin:auto}.card{background:#fffdf8;border:1px solid #d8cdbb;border-radius:18px;padding:28px 22px;box-shadow:0 8px 30px rgba(60,45,25,.08)}h1{text-align:center;font-family:Georgia,serif}.subtitle{text-align:center;color:#746958;font-size:14px;margin-bottom:28px}.prompt-card{margin-bottom:22px;padding:20px;background:#faf7f0;border:1px solid #d8cdbb;border-radius:14px}.prompt-title{font-family:Georgia,serif;font-size:21px}.prompt-description{color:#746958;font-size:13px}.button-area{display:flex;gap:8px;margin-bottom:12px}.copy-button,.toggle-button{flex:1;border:0;border-radius:10px;padding:12px 10px;font-size:14px;font-weight:bold}.copy-button{background:#3d342b;color:#fffdf8}.toggle-button{background:#e4ddd1;color:#40382f}.copy-button.success{background:#5d765b}.prompt-box{display:none;width:100%;min-height:350px;padding:16px;border:1px solid #d8cdbb;border-radius:10px;background:#fffdf8;font-size:13px;line-height:1.75;white-space:pre-wrap}.prompt-box.visible{display:block}.note{margin-top:24px;padding:14px;background:#eee8dd;color:#6b6257;font-size:12px;text-align:center;border-radius:10px}@media(max-width:600px){.button-area{flex-direction:column}.card{padding:22px 14px}}</style></head><body><div class="container"><div class="card"><h1>✦ Prompt Library ✦</h1><p class="subtitle">画像生成プロンプト配布ページ</p><div id="promptList"></div><div class="note">📋 各プロンプトの「コピーする」ボタンから全文を一括コピーできます。</div></div></div><script>const PROMPTS=[{"title": "【ポジティブ】", "description": "ポジティブプロンプト", "text": "rabbit ears, traditional Japanese clothing,\n\n((kimono made entirely of sheer black lace mesh)),\n((transparent black lace fabric)),\n((translucent lace material)),\n((intricate openwork black lace)),\n((delicate floral lace mesh)),\n((visible skin beneath the lace fabric)),\nsheer lace kimono, lace-covered kimono, open kimono, loose kimono,\nslightly disheveled kimono, lowered kimono collar, exposed collarbone,\nslightly exposed shoulders, elegant neckline,\n\n((long flowing sheer lace sleeves)),\n((transparent lace sleeves)),\nintricate lace sleeve edges, scalloped lace trim,\n\n((lace fabric hakama:1.6,))\n((long flowing hakama made entirely of sheer black lace mesh:1.4)),\n((transparent black lace hakama)),\n((translucent lace fabric:1.4)),\n((openwork lace hakama)),\n((visible legs through the translucent lace)),\nflowing sheer hakama panels,\n\nblack lace obi, sheer lace waist sash,\nsubtle red trim, subtle red accents, red hakama trim,\n((gold metal ornaments)),\n((gold metal fittings)),\n((gold decorative hardware)),\nornate metal accessories,\ncrescent moon metal ornament, ((decorative obi tassel)), elegant hanging tassel, traditional Japanese tassel ornament, delicate gold metal cap,\n\n((traditional Japanese geta sandals)), wooden geta, flat wooden soles, traditional geta straps,\n\n((red eyeliner)), vivid red eye makeup,\nelegant and alluring outfit,\ngraceful feminine silhouette,\nsubtle sensuality,\nmoonlit night aesthetic,\nrefined Japanese fantasy fashion,"}, {"title": "【ネガティブ】", "description": "ネガティブプロンプト", "text": "white fabric,((opaque fabric)), ((solid fabric)), ((thick fabric)),\n((opaque kimono)), ((opaque hakama)),\n((solid black kimono)), ((solid black hakama)),\nnormal cloth kimono, normal cloth hakama,\nsatin, silk, glossy fabric, leather, velvet,\npleated fabric, ordinary hakama, solid skirt,\n\n((lace pattern printed on fabric)),\n((lace pattern only)),\nlace-like pattern, fake lace, decorative lace only,\n\n((opaque lining)), ((inner lining)), ((black underlayer)),\nblack underskirt, full coverage undergarment,\n\n((red kimono)), ((red robe)), ((red hakama)),\nred dress, large red fabric areas, red sleeves, red clothing,\n\nwhite lace, white fabric,\n((gold fabric)), ((golden fabric)), ((gold cloth)),\ngold embroidery, gold textile,\n\nshort hakama, mini skirt, short skirt,\nwestern clothing, modern clothing, casual clothing,\narmor,\n\ncompletely closed kimono,\ncompletely closed hakama,\n\nexcessive nudity, fully transparent clothing,\nlingerie, bikini, swimsuit,\n\nmessy clothing, poorly designed clothing,\ndeformed clothing, extra sleeves, missing sleeves,\nextra legs, malformed legs"}, {"title": "【構図】", "description": "構図・ポーズ指定", "text": "((holding a large traditional wooden mallet)), \n((large Japanese mochi pounding mallet)),\nboth hands gripping the wooden mallet,\nlarge wooden mallet raised over one shoulder,\ndynamic pose,\nslightly turned body,\nwide stance,\nflowing sleeves,\ndynamic flowing fabric,\nenergetic yet elegant pose,"}];const list=document.getElementById("promptList");PROMPTS.forEach(item=>{const c=document.createElement("div"),t=document.createElement("h2"),d=document.createElement("p"),a=document.createElement("div"),b=document.createElement("button"),v=document.createElement("button"),x=document.createElement("textarea");c.className="prompt-card";t.className="prompt-title";d.className="prompt-description";a.className="button-area";b.className="copy-button";v.className="toggle-button";x.className="prompt-box";t.textContent=item.title;d.textContent=item.description;b.textContent="📋 コピーする";v.textContent="👁 プロンプトを見る";x.value=item.text;x.readOnly=true;b.onclick=async()=>{try{await navigator.clipboard.writeText(item.text)}catch(e){x.style.display="block";x.select();document.execCommand("copy")}b.classList.add("success");b.textContent="✓ コピーしました！";setTimeout(()=>{b.classList.remove("success");b.textContent="📋 コピーする"},2000)};v.onclick=()=>{x.classList.toggle("visible");v.textContent=x.classList.contains("visible")?"🙈 プロンプトを閉じる":"👁 プロンプトを見る"};a.append(b,v);c.append(t,d,a,x);list.appendChild(c)});</script></body></html>
